<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="softBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="200" cy="180" r="140" fill="url(#softBack)" stroke="#86EFAC" stroke-width="4" />

  <!-- Urban Skyline Silhouette inside circular emblem -->
  <g transform="translate(200, 180)" fill="url(#skylineGrad)">
    <!-- Tower 1 (Left narrow tower) -->
    <rect x="-85" y="-35" width="14" height="60" rx="1" />
    <!-- Tower 2 (Left-mid building with antenna) -->
    <rect x="-68" y="-70" width="22" height="95" rx="1" />
    <line x1="-57" y1="-70" x2="-57" y2="-90" stroke="#15803D" stroke-width="2.5" />
    <circle cx="-57" cy="-91" r="2.5" fill="#22C55E" />

    <!-- Center Spire / Skyscraper (Tallest) -->
    <polygon points="-30,-115 -25,-90 -35,-90" />
    <rect x="-42" y="-90" width="24" height="115" rx="2" />
    <!-- Windows pattern on center tower -->
    <g fill="#DCFCE7" opacity="0.8">
      <rect x="-38" y="-80" width="4" height="6" />
      <rect x="-30" y="-80" width="4" height="6" />
      <rect x="-38" y="-68" width="4" height="6" />
      <rect x="-30" y="-68" width="4" height="6" />
      <rect x="-38" y="-56" width="4" height="6" />
      <rect x="-30" y="-56" width="4" height="6" />
      <rect x="-38" y="-44" width="4" height="6" />
      <rect x="-30" y="-44" width="4" height="6" />
    </g>

    <!-- Center-Right Skyscraper with stepped crown -->
    <rect x="-14" y="-80" width="30" height="105" rx="1" />
    <rect x="-9" y="-92" width="20" height="12" />
    <polygon points="1,-105 -3,-92 5,-92" />

    <!-- Domed Civic Building -->
    <rect x="20" y="-50" width="35" height="75" rx="1" />
    <path d="M 23 -50 Q 37.5 -75 52 -50 Z" />

    <!-- Far Right Residential / Commercial Towers -->
    <rect x="58" y="-65" width="20" height="90" rx="1" />
    <rect x="80" y="-30" width="14" height="55" rx="1" />
  </g>

  <!-- Dynamic Sweeping Eco-Leaf wrapping around the city from bottom-left to top-right -->
  <g transform="translate(200, 180)">
    <!-- Main Leaf Body -->
    <path d="M -115 5 C -125 75, -60 125, 10 120 C 75 115, 120 75, 125 10 C 115 50, 70 85, 15 85 C -45 85, -95 55, -100 15 Z" fill="url(#leafGrad)" />
    
    <!-- Large Front Organic Leaf Blade curving up -->
    <path d="M -115 15 C -80 -25, -20 -15, 25 35 C 70 85, 110 50, 120 15 C 105 85, 40 115, -25 110 C -75 105, -115 70, -115 15 Z" fill="url(#leafGrad)" />
    
    <!-- Central Leaf Vein -->
    <path d="M -115 15 Q -40 60 45 45 Q 85 40 120 15" stroke="#86EFAC" stroke-width="2.5" fill="none" />
    <path d="M -70 35 Q -55 20 -40 25" stroke="#86EFAC" stroke-width="1.5" fill="none" />
    <path d="M -40 45 Q -25 30 -10 35" stroke="#86EFAC" stroke-width="1.5" fill="none" />
    <path d="M -5 50 Q 15 35 30 40" stroke="#86EFAC" stroke-width="1.5" fill="none" />
  </g>

  <!-- Brand Typography: GREENCITY -->
  <g transform="translate(200, 360)">
    <text font-family="'Arial Black', 'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#15803D" text-anchor="middle" letter-spacing="3">
      GREENCITY
    </text>
    <text y="24" font-family="'Arial', sans-serif" font-weight="700" font-size="12" fill="#4B5563" text-anchor="middle" letter-spacing="5">
      REPORT. TRACK. CLEAN.
    </text>
  </g>
</svg>
