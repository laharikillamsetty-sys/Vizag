<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <radialGradient id="gvmcGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="60%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </radialGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <!-- Arc for English text around top right -->
    <path id="engRingArc" d="M 90 230 A 185 185 0 0 1 410 230" fill="none" />
    <!-- Arc for Telugu text around top left -->
    <path id="telRingArc" d="M 65 240 A 185 185 0 0 0 435 240" fill="none" />
  </defs>

  <!-- Outer Ring with Orange & Red border -->
  <circle cx="250" cy="240" r="230" fill="#FFFFFF" stroke="#EA580C" stroke-width="8" />
  <circle cx="250" cy="240" r="222" fill="#FFFFFF" stroke="#C2410C" stroke-width="2" />
  <circle cx="250" cy="240" r="162" fill="#FFFFFF" stroke="#EA580C" stroke-width="4" />

  <!-- Circular Ring Text: English on top -->
  <path id="topArc" d="M 68 240 A 182 182 0 0 1 432 240" fill="none" />
  <text fill="#B91C1C" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="1.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      GREATER VISAKHAPATNAM MUNICIPAL CORPORATION
    </textPath>
  </text>

  <!-- Telugu Text on bottom ring -->
  <path id="bottomArc" d="M 432 240 A 182 182 0 0 1 68 240" fill="none" />
  <text fill="#1E3A8A" font-family="'Noto Sans Telugu', 'Gautami', Arial, sans-serif" font-weight="900" font-size="18">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      మహా విశాఖ నగరపాలక సంస్థ • GVMC •
    </textPath>
  </text>

  <!-- Inner Center Shield Circle with Green Grass -->
  <circle cx="250" cy="240" r="158" fill="url(#gvmcGreen)" stroke="#15803D" stroke-width="3" />

  <!-- Inner Symbols inside GVMC emblem -->

  <!-- 1. Dolphin's Nose Hill & Coastline with Lighthouse (Vizag Icon) -->
  <g id="dolphinsNose">
    <!-- Blue Ocean Waves at bottom -->
    <path d="M 120 290 Q 180 270 250 290 Q 320 310 380 290 L 380 370 A 158 158 0 0 1 120 365 Z" fill="url(#seaGrad)" />
    <!-- Wave ripples -->
    <path d="M 130 315 Q 180 305 240 315 Q 300 325 360 315" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <path d="M 140 335 Q 200 325 260 335 Q 320 345 370 335" stroke="#FFFFFF" stroke-width="2.5" fill="none" />

    <!-- Dolphin's Nose Hill Silhouette (Dark Rocky Promontory) -->
    <path d="M 230 290 C 260 250, 310 240, 350 255 C 380 265, 390 295, 385 315 L 230 315 Z" fill="#334155" />
    <path d="M 290 250 C 320 242, 345 250, 360 260" stroke="#64748B" stroke-width="2" fill="none" />

    <!-- Vizag Coastal Lighthouse atop Dolphin's Nose -->
    <rect x="330" y="225" width="8" height="25" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" />
    <!-- Red stripes on lighthouse -->
    <rect x="330" y="232" width="8" height="5" fill="#DC2626" />
    <polygon points="334,217 330,225 338,225" fill="#EA580C" />
    <!-- Beams of light from lighthouse -->
    <polygon points="334,222 260,205 265,215" fill="#FEF08A" opacity="0.7" />
  </g>

  <!-- 2. Traditional Kalasham / Purna Kumbham (Prosperity & Auspiciousness) in center -->
  <g transform="translate(250, 215)" id="kalasham">
    <!-- Golden Purna Kumbham Pot -->
    <ellipse cx="0" cy="18" rx="22" ry="16" fill="#F59E0B" stroke="#B45309" stroke-width="2" />
    <path d="M -16 10 C -18 2, -10 -2, 0 -2 C 10 -2, 18 2, 16 10 Z" fill="#FCD34D" stroke="#B45309" stroke-width="1.5" />
    <!-- Mango leaves branching out -->
    <path d="M 0 -2 Q -18 -15 -24 -2" stroke="#16A34A" stroke-width="2" fill="#22C55E" />
    <path d="M 0 -2 Q 18 -15 24 -2" stroke="#16A34A" stroke-width="2" fill="#22C55E" />
    <path d="M 0 -2 Q -8 -22 -14 -10" stroke="#16A34A" stroke-width="2" fill="#22C55E" />
    <path d="M 0 -2 Q 8 -22 14 -10" stroke="#16A34A" stroke-width="2" fill="#22C55E" />
    <!-- Coconut on top -->
    <ellipse cx="0" cy="-6" rx="9" ry="12" fill="#92400E" stroke="#78350F" stroke-width="1.5" />
    <!-- Swastika / Auspicious red dot on pot -->
    <circle cx="0" cy="18" r="4" fill="#DC2626" />
  </g>

  <!-- 3. Sanitation Worker with Broom (Swachhata / Cleanliness symbol) on left -->
  <g transform="translate(160, 220)" id="sanitationWorker">
    <!-- Person figure sweeping -->
    <circle cx="0" cy="-30" r="9" fill="#1E3A8A" />
    <!-- Torso bent forward sweeping -->
    <path d="M 0 -20 L -6 5 L 8 18" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Arms holding long broom -->
    <path d="M -2 -14 L 14 -2 L 24 16" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Broom stick & brush bristles -->
    <line x1="8" y1="-18" x2="30" y2="28" stroke="#78350F" stroke-width="3" />
    <polygon points="26,24 35,22 36,34 25,32" fill="#D97706" />
    <!-- Cleaned floor dust sparks -->
    <circle cx="34" cy="30" r="1.5" fill="#FFFFFF" />
    <circle cx="38" cy="27" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- 4. Smart City Technology / Computer Monitor on Top -->
  <g transform="translate(250, 135)" id="smartCityTech">
    <!-- Computer Monitor with data graph -->
    <rect x="-24" y="-18" width="48" height="30" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <rect x="-20" y="-14" width="40" height="22" fill="#1E293B" />
    <path d="M -16 -4 L -8 -10 L 0 -2 L 8 -12 L 16 -6" stroke="#34D399" stroke-width="2" fill="none" />
    <!-- Stand -->
    <rect x="-4" y="12" width="8" height="8" fill="#475569" />
    <rect x="-14" y="20" width="28" height="3" rx="1" fill="#475569" />
  </g>

  <!-- 5. Road Network Infrastructure & Transport on Right -->
  <g transform="translate(340, 215)" id="roadTransport">
    <path d="M -15 15 L 15 -15 L 25 -5 L -5 25 Z" fill="#475569" />
    <line x1="-10" y1="20" x2="20" y2="-10" stroke="#FDE047" stroke-dasharray="4,3" stroke-width="2" />
    <!-- Delivery / Service vehicle -->
    <rect x="5" y="-3" width="16" height="10" rx="2" fill="#2563EB" />
    <rect x="15" y="-1" width="5" height="6" fill="#93C5FD" />
    <circle cx="9" cy="8" r="3" fill="#0F172A" />
    <circle cx="18" cy="8" r="3" fill="#0F172A" />
  </g>

  <!-- 6. Happy Citizen Family Silhouette -->
  <g transform="translate(205, 275)" id="citizenFamily">
    <!-- Adult 1 -->
    <circle cx="-12" cy="-14" r="5" fill="#0F172A" />
    <path d="M -12 -9 L -12 6" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
    <!-- Child -->
    <circle cx="0" cy="-6" r="3.5" fill="#0F172A" />
    <path d="M 0 -2 L 0 8" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
    <!-- Adult 2 -->
    <circle cx="12" cy="-12" r="5" fill="#0F172A" />
    <path d="M 12 -7 L 12 6" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Subtitle Ribbon below crest: "City of Destiny" -->
  <g transform="translate(250, 492)">
    <text font-family="'Times New Roman', serif" font-weight="bold" font-size="26" font-style="italic" fill="#0F172A" text-anchor="middle" letter-spacing="1">
      City of Destiny
    </text>
  </g>
</svg>
