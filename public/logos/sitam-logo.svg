<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF4500" />
    </radialGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Background circle soft glow -->
  <circle cx="200" cy="200" r="195" fill="#FFFFFF" />

  <!-- Top Brand Label: SITAM -->
  <text x="310" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#1E293B" text-anchor="middle" letter-spacing="2">SITAM</text>

  <!-- Radiant Sun at top center -->
  <g transform="translate(200, 115)">
    <!-- Sun rays radiating out -->
    <path d="M0 -75 L4 -52 L-4 -52 Z" fill="#F97316" />
    <path d="M30 -68 L24 -48 L17 -53 Z" fill="#F59E0B" />
    <path d="M55 -50 L42 -35 L38 -42 Z" fill="#F97316" />
    <path d="M70 -25 L50 -18 L50 -26 Z" fill="#F59E0B" />
    <path d="M75 0 L52 -4 L52 4 Z" fill="#F97316" />
    <path d="M70 25 L50 26 L50 18 Z" fill="#F59E0B" />
    <path d="M-30 -68 L-17 -53 L-24 -48 Z" fill="#F59E0B" />
    <path d="M-55 -50 L-38 -42 L-42 -35 Z" fill="#F97316" />
    <path d="M-70 -25 L-50 -26 L-50 -18 Z" fill="#F59E0B" />
    <path d="M-75 0 L-52 4 L-52 -4 Z" fill="#F97316" />
    <path d="M-70 25 L-50 18 L-50 26 Z" fill="#F59E0B" />

    <!-- Radiant Flaming outer crest -->
    <path d="M -50 -15 C -45 -55, 45 -55, 50 -15 C 40 10, -40 10, -50 -15 Z" fill="url(#sunGlow)" />
    <circle cx="0" cy="-22" r="35" fill="url(#sunGlow)" stroke="#EA580C" stroke-width="2" />

    <!-- Pen Nib standing vertically at top through the sun -->
    <path d="M -7 -95 L 7 -95 L 6 -50 L 0 -22 L -6 -50 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.5" />
    <line x1="0" y1="-95" x2="0" y2="-40" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="0" cy="-40" r="2.5" fill="#FFFFFF" />

    <!-- Red Bindi / Tilak in center -->
    <circle cx="0" cy="-10" r="7" fill="#DC2626" />
  </g>

  <!-- Open Book with Eyes -->
  <g transform="translate(200, 185)">
    <!-- Book pages forming the face contour -->
    <path d="M 0 -30 Q 55 -50 95 -32 Q 102 2 85 18 Q 45 -2 0 10 Q -45 -2 -85 18 Q -102 2 -95 -32 Q -55 -50 0 -30 Z" fill="url(#bookGrad)" stroke="#0369A1" stroke-width="2.5" />
    <path d="M 0 -22 Q 50 -40 88 -26" stroke="#0284C7" stroke-width="1.5" fill="none" />
    <path d="M 0 -14 Q 45 -30 80 -18" stroke="#0284C7" stroke-width="1.5" fill="none" />
    <path d="M 0 -22 Q -50 -40 -88 -26" stroke="#0284C7" stroke-width="1.5" fill="none" />
    <path d="M 0 -14 Q -45 -30 -80 -18" stroke="#0284C7" stroke-width="1.5" fill="none" />

    <!-- Benevolent Eyes looking forward (Vidya / Wisdom) -->
    <!-- Left Eye -->
    <g transform="translate(-40, -14)">
      <path d="M -30 0 Q 0 -18 30 0 Q 0 18 -30 0 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
      <circle cx="0" cy="0" r="9" fill="#0F172A" />
      <circle cx="3" cy="-3" r="3" fill="#FFFFFF" />
      <path d="M -35 -2 Q 0 -24 35 -2" stroke="#0F172A" stroke-width="2" fill="none" />
    </g>
    <!-- Right Eye -->
    <g transform="translate(40, -14)">
      <path d="M -30 0 Q 0 -18 30 0 Q 0 18 -30 0 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
      <circle cx="0" cy="0" r="9" fill="#0F172A" />
      <circle cx="3" cy="-3" r="3" fill="#FFFFFF" />
      <path d="M -35 -2 Q 0 -24 35 -2" stroke="#0F172A" stroke-width="2" fill="none" />
    </g>
    <!-- Nose bridge and gentle smile line -->
    <path d="M -3 3 Q 0 12 3 3" stroke="#DC2626" stroke-width="2.5" fill="none" />
    <path d="M -12 18 Q 0 25 12 18" stroke="#DC2626" stroke-width="2" fill="none" />
  </g>

  <!-- Crisscrossed Rice/Floral Stalks and Flourishes -->
  <g transform="translate(200, 245)">
    <!-- Cyan Flourish Waves -->
    <path d="M -75 -25 C -50 -45, -30 -10, -10 -15 C -30 5, -60 10, -75 -25 Z" fill="#38BDF8" opacity="0.8" />
    <path d="M 75 -25 C 50 -45, 30 -10, 10 -15 C 30 5, 60 10, 75 -25 Z" fill="#38BDF8" opacity="0.8" />

    <!-- Green Laurels / Paddy stalks -->
    <path d="M -60 -15 Q -30 -5 0 -25 Q 30 -5 60 -15" stroke="#16A34A" stroke-width="3" fill="none" />
    <circle cx="-45" cy="-12" r="3" fill="#16A34A" />
    <circle cx="-30" cy="-15" r="3" fill="#16A34A" />
    <circle cx="-15" cy="-20" r="3" fill="#16A34A" />
    <circle cx="45" cy="-12" r="3" fill="#16A34A" />
    <circle cx="30" cy="-15" r="3" fill="#16A34A" />
    <circle cx="15" cy="-20" r="3" fill="#16A34A" />

    <!-- Center Oval Badge with stylized 'S' -->
    <ellipse cx="0" cy="10" rx="36" ry="32" fill="#FFFFFF" stroke="#DC2626" stroke-width="3" />
    <!-- Blue ribbon surround -->
    <path d="M -38 10 C -45 25, -25 35, 0 35 C 25 35, 45 25, 38 10" stroke="#0284C7" stroke-width="2.5" fill="none" />

    <!-- Stylized Red 'S' Monogram -->
    <path d="M 12 -5 C 10 -16, -16 -16, -14 -2 C -12 12, 16 6, 14 20 C 12 30, -14 30, -12 18" fill="none" stroke="url(#sGrad)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Curved Telugu Motto: పండితాః సమదర్శినః -->
  <!-- Arc path for text -->
  <path id="teluguArc" d="M 50 310 Q 200 375 350 310" fill="none" />
  <text fill="#B91C1C" font-family="'Noto Sans Telugu', 'Gautami', 'Arial', sans-serif" font-weight="900" font-size="24">
    <textPath href="#teluguArc" startOffset="50%" text-anchor="middle">
      పండితాః సమదర్శినః
    </textPath>
  </text>

  <!-- Bottom: SINCE 1996 -->
  <text x="200" y="365" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#1E3A8A" text-anchor="middle" letter-spacing="7">
    SINCE 1996
  </text>
</svg>
